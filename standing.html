<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Standing</title>
    <link rel="stylesheet" href="web/shared.css">
    <style>
        .table-scroll {
            overflow-x: auto;
        }

        .table-scroll .data-table {
            min-width: 1000px;
        }

        .data-table th {
            white-space: normal;
        }

        .data-table .col-name {
            white-space: normal;
        }

        .data-table .col-readiness {
            color: var(--text-main);
            font-weight: 600;
            min-width: 150px;
        }

        .data-table .readiness-release { color: #66bb6a; }
        .data-table .readiness-near { color: #9ccc65; }
        .data-table .readiness-alpha { color: #ffca28; }
        .data-table .readiness-slice { color: #ffb74d; }
        .data-table .readiness-bound { color: #ff8a65; }
        .data-table .readiness-foundation { color: #ef5350; }
    </style>
</head>
<body>
    <div class="game-page">
        <header class="game-header">
            <h1 id="title">Game Standing</h1>
        </header>

        <div id="loading" class="state-message">Loading standing.md&hellip;</div>
        <div id="error" class="state-error" style="display: none;"></div>

        <div id="content" style="display: none;">
            <div class="page-meta" id="meta"></div>
            <div class="sidebar-section" id="criteria"></div>
            <div id="extra"></div>

            <div class="table-scroll">
                <table class="data-table">
                    <thead>
                        <tr id="tableHead"></tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>

            <div class="game-footer">
                <p>This page renders <code>standing.md</code> live via JavaScript &mdash; edit the Markdown file and reload; nothing here is duplicated by hand.</p>
            </div>
        </div>
    </div>

    <script>
        const SOURCE = 'standing.md';
        // Columns map 1:1 to standing.md: Rank | Game | Readiness | Ship window | Deep dive.
        const COLUMN_CLASSES = ['', 'col-name', 'col-readiness', 'col-estimate', 'col-brief'];

        function escapeHtml(s) {
            return s
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        // Minimal inline Markdown: **bold**, `code`, *italic* (in that order, so ** isn't eaten by *).
        function inlineMd(s) {
            let t = escapeHtml(s);
            t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            t = t.replace(/`([^`]+?)`/g, '<code>$1</code>');
            t = t.replace(/\*(.+?)\*/g, '<em>$1</em>');
            return t;
        }

        function splitTableRow(line) {
            let cells = line.trim();
            if (cells.startsWith('|')) cells = cells.slice(1);
            if (cells.endsWith('|')) cells = cells.slice(0, -1);
            return cells.split('|').map(c => c.trim());
        }

        function isSeparatorRow(cells) {
            return cells.every(c => /^:?-+:?$/.test(c));
        }

        function parseMarkdown(md) {
            const lines = md.replace(/\r\n/g, '\n').split('\n');
            let title = null;
            const paragraphs = [];
            const tableLines = [];
            let buffer = [];

            const flush = () => {
                if (buffer.length) {
                    paragraphs.push(buffer.join(' '));
                    buffer = [];
                }
            };

            for (const raw of lines) {
                const line = raw.trim();
                if (line.startsWith('#')) {
                    flush();
                    if (title === null) title = line.replace(/^#+\s*/, '');
                } else if (line.startsWith('|')) {
                    flush();
                    tableLines.push(line);
                } else if (line === '') {
                    flush();
                } else {
                    buffer.push(line);
                }
            }
            flush();

            return { title: title || 'Game Standing', paragraphs, tableLines };
        }

        function parseTable(tableLines) {
            if (tableLines.length < 2) return null;
            const header = splitTableRow(tableLines[0]);
            const rest = tableLines.slice(1).map(splitTableRow);
            // Second row is the `| --- | --- |` alignment separator; drop it wherever it lands.
            const rows = rest.filter(cells => !isSeparatorRow(cells));
            return { header, rows };
        }

        function render(md) {
            const { title, paragraphs, tableLines } = parseMarkdown(md);

            document.title = title;
            document.getElementById('title').textContent = title;

            const metaEl = document.getElementById('meta');
            const criteriaEl = document.getElementById('criteria');
            const extraEl = document.getElementById('extra');
            metaEl.innerHTML = '';
            criteriaEl.innerHTML = '';
            extraEl.innerHTML = '';

            for (const p of paragraphs) {
                const html = `<p>${inlineMd(p)}</p>`;
                if (/^Scope:|^Last updated:/.test(p)) {
                    metaEl.insertAdjacentHTML('beforeend', html);
                } else if (/^Method:|^Scoring:|^Ship windows:|^Evidence pass:/.test(p)) {
                    criteriaEl.insertAdjacentHTML('beforeend', html);
                } else {
                    extraEl.insertAdjacentHTML('beforeend', `<div class="callout">${html}</div>`);
                }
            }

            const table = parseTable(tableLines);
            const headRow = document.getElementById('tableHead');
            const body = document.getElementById('tableBody');
            headRow.innerHTML = '';
            body.innerHTML = '';

            if (table) {
                for (const h of table.header) {
                    const th = document.createElement('th');
                    th.textContent = h;
                    headRow.appendChild(th);
                }
                for (const cells of table.rows) {
                    if (cells.every(c => c === '')) continue;
                    const tr = document.createElement('tr');
                    cells.forEach((cell, i) => {
                        const td = document.createElement('td');
                        td.innerHTML = inlineMd(cell);
                        if (COLUMN_CLASSES[i]) td.className = COLUMN_CLASSES[i];
                        if (i === 2) {
                            const score = Number((cell.match(/\d+/) || [0])[0]);
                            const band = score >= 90 ? 'release'
                                : score >= 80 ? 'near'
                                : score >= 70 ? 'alpha'
                                : score >= 60 ? 'slice'
                                : score >= 40 ? 'bound'
                                : 'foundation';
                            td.classList.add(`readiness-${band}`);
                        }
                        tr.appendChild(td);
                    });
                    body.appendChild(tr);
                }
            }

            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';
        }

        function showError(err) {
            document.getElementById('loading').style.display = 'none';
            const el = document.getElementById('error');
            el.style.display = 'block';
            el.innerHTML = `
                <p><strong>Couldn't load ${SOURCE}:</strong> ${escapeHtml(err.message || String(err))}</p>
                <p>This page fetches <code>${SOURCE}</code> from the same folder at load time, which browsers block when the file is opened directly via <code>file://</code>. Serve this directory over HTTP instead, e.g.:</p>
                <pre>python -m http.server 8080</pre>
                <p>&hellip;then open <code>http://localhost:8080/standing.html</code>.</p>
            `;
        }

        async function load() {
            try {
                const res = await fetch(SOURCE, { cache: 'no-store' });
                if (!res.ok) throw new Error(`HTTP ${res.status} fetching ${SOURCE}`);
                render(await res.text());
            } catch (err) {
                showError(err);
            }
        }

        load();
    </script>
</body>
</html>
