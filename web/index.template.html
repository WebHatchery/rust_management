<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{DESCRIPTION}}">
    <title>{{TITLE}} | Web Hatchery Games</title>
    <link rel="stylesheet" href="../shared.css">
    <link rel="stylesheet" href="../bug-report.css">
    <style>
        .game-container canvas {
            image-rendering: {{CANVAS_RENDERING}};
        }
    </style>
{{CUSTOM_CSS}}
</head>

<body>
    <div class="game-page">
        <header class="game-header">
            <h1>{{TITLE}}</h1>
            <a href="../" class="back-link">Back to All Games</a>
        </header>

        <!-- Game Canvas -->
        <div class="game-container" id="game-container">
            <div class="loading-overlay" id="loading">
                <div class="loading-spinner"></div>
                <p>Loading game...</p>
            </div>
            <canvas id="glcanvas" tabindex="1"{{CANVAS_SIZE}}></canvas>
        </div>

        <!-- Controls Bar -->
        <div class="game-controls">
            <button class="btn btn-secondary btn-icon" onclick="toggleFullscreen()" title="Fullscreen">FS</button>
            <button class="btn btn-secondary" onclick="focusGame()">Focus Game</button>
            <span style="flex: 1;"></span>
            <span style="color: var(--text-muted); font-size: 0.85rem;">{{CONTROLS_HINT}}</span>
        </div>

        <!-- Info Section -->
        <div class="game-info">
            <div class="info-main">
{{INFO_SECTIONS}}
            </div>

            <aside class="game-sidebar">
                <div class="sidebar-section">
                    <h3>Status</h3>
                    <span class="status-badge {{STATUS_CLASS}}">{{STATUS_TEXT}}</span>
                </div>

                <div class="sidebar-section">
                    <h3>Details</h3>
                    <ul class="meta-list">
{{DETAILS}}
                    </ul>
                </div>
{{DOWNLOADS}}{{REPOSITORY}}
            </aside>
        </div>

        <footer class="game-footer">
            <p>Built with Rust + Macroquad | <a href="/">Web Hatchery</a></p>
        </footer>
    </div>

    <!-- Macroquad JS bundle. -->
    <script src="mq_js_bundle.js{{ASSET_CACHE_BUST}}"></script>
    <!-- sapp_jsutils provides consume_js_object/js_object used by storage.js. -->
    <script src="sapp_jsutils.js{{ASSET_CACHE_BUST}}"></script>
    <!-- quad-net HTTP/WS bridge; registers its miniquad plugin before the wasm
         loads. Inert for games that never make a request. -->
    <script src="{{QUAD_NET_JS_SRC}}{{ASSET_CACHE_BUST}}"></script>
    <!-- localStorage bridge for save/load persistence (must load before the wasm). -->
    <script src="{{STORAGE_JS_SRC}}{{ASSET_CACHE_BUST}}"></script>
    <!-- Clipboard bridge; inert for games that never call it. -->
    <script src="{{CLIPBOARD_JS_SRC}}{{ASSET_CACHE_BUST}}"></script>
    <script>
        (function () {
            var overlay = document.getElementById('loading');
            var glcanvas = document.getElementById('glcanvas');
            // Keep macroquad's drawing buffer matched to the canvas CSS size. The
            // engine only re-measures on the window 'resize' event, but the
            // responsive container can change size without firing one, which leaves
            // mouse input offset from the rendered UI (the classic "cursor is in the
            // wrong place" bug). Its onresize handler dereferences wasm_exports, so
            // only sync once the game module has loaded.
            function syncCanvasSize() {
                if (window.wasm_exports) window.dispatchEvent(new Event('resize'));
            }
            // Reveal the canvas only once the wasm has instantiated and started
            // (mq_js_bundle sets the global wasm_exports just before calling main()),
            // instead of synchronously while the ~2 MB module is still downloading.
            var waitStart = Date.now();
            (function waitForGame() {
                if (window.wasm_exports) {
                    requestAnimationFrame(function () {
                        if (overlay) overlay.style.display = 'none';
                        syncCanvasSize();
                        if (window.ResizeObserver && glcanvas) {
                            new ResizeObserver(syncCanvasSize).observe(glcanvas);
                        }
                    });
                } else if (Date.now() - waitStart > 30000) {
                    if (overlay) overlay.style.display = 'none';
                } else {
                    requestAnimationFrame(waitForGame);
                }
            })();
            // A scaled display (devicePixelRatio > 1) changes the framebuffer size
            // without changing the CSS size, so re-sync on zoom / monitor changes too.
            if (window.matchMedia) {
                var dprQuery = window.matchMedia('(resolution: 1dppx)');
                if (dprQuery.addEventListener) {
                    dprQuery.addEventListener('change', syncCanvasSize);
                }
            }
            // Entering/leaving fullscreen resizes the canvas; some browsers report
            // the new size a frame late, so sync again shortly after.
            document.addEventListener('fullscreenchange', function () {
                syncCanvasSize();
                setTimeout(syncCanvasSize, 100);
                setTimeout(function () { if (glcanvas) glcanvas.focus(); }, 0);
            });
        })();

        // Canvas input hygiene, applied to every game: clicking anywhere hands
        // focus back to the canvas, the browser context menu never covers the
        // game, and arrow keys / space scroll the game rather than the page.
        (function () {
            var glcanvas = document.getElementById('glcanvas');
            if (!glcanvas) return;
            var scrollKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Spacebar'];

            glcanvas.focus();
            window.addEventListener('click', function () { glcanvas.focus(); });
            glcanvas.addEventListener('contextmenu', function (event) { event.preventDefault(); });
            window.addEventListener('keydown', function (event) {
                // Only while the game has focus, so the bug-report form still works.
                if (document.activeElement === glcanvas && scrollKeys.indexOf(event.key) !== -1) {
                    event.preventDefault();
                }
            }, { passive: false });

            // Pointer lock for first-person games. Browsers only grant it from a
            // user gesture, so it has to be requested here on mousedown -- a
            // set_cursor_grab() call from the wasm frame loop gets rejected.
            // blocked_regions are HUD rects, in the game's logical resolution,
            // that must stay clickable instead of grabbing the cursor.
            var lock = {{POINTER_LOCK}};
            if (lock) {
                glcanvas.addEventListener('mousedown', function (event) {
                    glcanvas.focus();
                    if (document.pointerLockElement === glcanvas) return;
                    var rect = glcanvas.getBoundingClientRect();
                    if (!rect.width || !rect.height) return;
                    var x = (event.clientX - rect.left) / rect.width * lock.logical_width;
                    var y = (event.clientY - rect.top) / rect.height * lock.logical_height;
                    var blocked = (lock.blocked_regions || []).some(function (r) {
                        return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
                    });
                    if (blocked) return;
                    try { glcanvas.requestPointerLock(); } catch (error) { /* not supported */ }
                }, { capture: true });
            }
        })();
{{PRE_LOAD_JS}}
        load("{{WASM}}{{WASM_CACHE_BUST}}");
{{POST_LOAD_JS}}

        function toggleFullscreen() {
            const container = document.getElementById('game-container');
            if (!document.fullscreenElement) {
                container.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        function focusGame() {
            document.getElementById('glcanvas').focus();
        }
    </script>
{{CUSTOM_JS}}

    <!-- Player bug reporting -> Project Roost Fix Queue (shared widget). -->
    <div id="roost-bug-report" data-roost-slug="{{ROOST_SLUG}}"></div>
    <script src="../bug-report.js"></script>
    <!-- Ko-fi support widget (https://ko-fi.com/webhatchery) -->
    <script src='https://storage.ko-fi.com/cdn/scripts/overlay-widget.js'></script>
    <script>
        kofiWidgetOverlay.draw('webhatchery', {
            'type': 'floating-chat',
            'floating-chat.donateButton.text': 'Support me',
            'floating-chat.donateButton.background-color': '#00b9fe',
            'floating-chat.donateButton.text-color': '#fff'
        });
    </script>
</body>

</html>
